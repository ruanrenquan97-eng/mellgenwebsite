  <style>
    :root {

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== Layout ===== */
    .login-container {

    .brand-header { margin-bottom: 32px; }

      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .logo-box {
      width: 40px; height: 40px;
      background: var(--color-primary);

    /* ===== Form Elements ===== */

      background-repeat: no-repeat; background-position: right 12px center;

    /* ===== Form Options ===== */

    /* ===== Loading Spinner ===== */

      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .login-left { flex: 0 0 100%; max-width: 100%; padding: 32px 24px; }
      .login-right { display: none; }
    }
  </style>

<script>
  /* ===== 密码显示/隐藏 ===== */
  function togglePwd(btn) {
    var input = document.getElementById('password');
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    } else {
      input.type = 'password';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
  }

  /* ===== 错误信息 ===== */
  function showError(msg) {
    var el = document.getElementById('errorMsg');
    document.getElementById('jsErrorMsg').textContent = msg;
    el.classList.add('show');
  }
  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('jsErrorMsg').textContent = '';
  }

  /* ===== 检查 CAS 服务端报错 ===== */
  (function checkServerError(){
    var el = document.getElementById('errorMsg');
    if (el && el.textContent.trim()) {
      el.classList.add('show');
    }
  })();

  /* ===== 记住密码 ===== */
  var REMEMBER_KEY = 'cas_remember';

  function saveRemember() {
    var username = $('#username').val().trim();
    var password = $('#password').val();
    if ($('#rememberMe').is(':checked') && username) {
      localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: username, p: password }));
    } else {
      localStorage.removeItem(REMEMBER_KEY);
    }
  }

  function loadRemember() {
    try {
      var data = JSON.parse(localStorage.getItem(REMEMBER_KEY));
      if (data && data.u) {
        $('#username').val(data.u);
        $('#password').val(data.p || '');
        $('#rememberMe').prop('checked', true);
      }
    } catch(e) {}
  }

  loadRemember();

  /* ===== 登录入口 ===== */
  var noClick = false;
  var verifyCodeMode = false;
  var currentTab = '';

  function doLogin() {
    if (noClick) return;
    var username = $('#username').val().trim();
    var password = $('#password').val();
    var captcha  = $('#captcha').val().trim();
    hideError();

    if (!username) { showError('请输入账号'); $('#username').focus(); return; }
    if (!password) { showError('请输入密码'); $('#password').focus(); return; }
    if (!captcha)  { showError('请输入图形Verification Code'); $('#captcha').focus(); return; }

    if (verifyCodeMode) { verifyMobileCodeFn(username); return; }

    // 显示加载状态
    $('#btnLoginText').html('<span class="spin-loader"></span>');
    noClick = true;

    $.ajax({
      url: '/verifyLoginInfo',
      type: 'POST', dataType: 'json',
      data: { userName: username, password: password, captcha: captcha },
      success: function(data) {
        if (data.code === 200) {
          saveRemember();
          checkLoginIp(username);
        } else {
          showError(data.message || '账号或密码错误');
          resetBtn();
          $('#captchaImg').trigger('click');
        }
      },
      error: function() { resetBtn(); showError('网络异常，请稍后重试'); }
    });
  }

  function resetBtn() {
    noClick = false;
    $('#btnLoginText').text('立即登录');
  }

  /* ===== IP 校验 ===== */
  function checkLoginIp(username) {
    $.ajax({
      url: '/verifyLoginIp',
      type: 'POST', dataType: 'json',
      data: { userName: username },
      success: function(data) {
        var needVerify = false;
        if (data && data.length) {
          var sel = $('#mobileSelect');
          sel.empty();
          data.forEach(function(v, i) {
            if (!v.verify) needVerify = true;
            if (v.mobile) {
              sel.append('<option value="' + v.tab + '">' + v.mobile + '</option>');
            }
          });
          if (sel.find('option').length === 0) {
            sel.append('<option value="-1">-</option>');
          } else {
            currentTab = sel.val();
          }
        }
        if (needVerify) {
          $('#ipVerifySection').addClass('show');
          verifyCodeMode = true;
          resetBtn();
        } else {
          $('#realSubmit').trigger('click');
        }
      },
      error: function() { $('#realSubmit').trigger('click'); }
    });
  }

  /* ===== 发送Verification Code ===== */
  var countdown = 0;
  function sendCode() {
    if (countdown > 0) return;
    var username = $('#username').val().trim();
    if (!username) { showError('请先填写账号'); return; }
    $.ajax({
      url: '/sendCode',
      type: 'POST', dataType: 'json',
      data: { userName: username, tab: $('#mobileSelect').val() },
      success: function(data) {
        if (data.isSuccess) { startCountdown(); }
        else { showError(data.data || '发送失败，请稍后重试'); }
      },
      error: function() { showError('网络异常，请稍后重试'); }
    });
  }
  function startCountdown() {
    countdown = 60;
    var btn = $('#btnSend');
    btn.addClass('disabled');
    var t = setInterval(function() {
      if (countdown > 0) { countdown--; btn.text(countdown + 's'); }
      else { clearInterval(t); btn.text('重新发送').removeClass('disabled'); }
    }, 1000);
  }

  /* ===== 手机Verification Code校验 ===== */
  function verifyMobileCodeFn(username) {
    var code = $('#code').val().trim();
    if (!code) { showError('请输入手机Verification Code'); $('#code').focus(); return; }
    $('#btnLoginText').html('<span class="spin-loader"></span>');
    noClick = true;
    $.ajax({
      url: '/verifyMobileCode',
      type: 'POST', dataType: 'json',
      data: { code: code, userName: username, tab: $('#mobileSelect').val() },
      success: function(data) {
        if (data.isSuccess) { hideError(); $('#realSubmit').trigger('click'); }
        else { showError(data.data || 'Verification Code错误'); resetBtn(); }
      },
      error: function() { resetBtn(); showError('网络异常，请稍后重试'); }
    });
  }

  /* ===== 回车登录 ===== */
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 13) doLogin();
  });

  /* ===== 账号改变Reset状态 ===== */
  $('#username').on('change', function() {
    verifyCodeMode = false; noClick = false;
    $('#ipVerifySection').removeClass('show');
    $('#btnLoginText').text('立即登录');
    hideError();
    if (!$('#rememberMe').is(':checked')) {
      localStorage.removeItem(REMEMBER_KEY);
    }
  });

  /* ===== 手机号下拉切换 ===== */
  $('#mobileSelect').on('change', function() {
    currentTab = $(this).val();
    $('#code').val('');
  });

  /* ===== 取消记住密码时清除存储 ===== */
  $('#rememberMe').on('change', function() {
    if (!$(this).is(':checked')) {
      localStorage.removeItem(REMEMBER_KEY);
    }
  });

  /* ===== 防 iframe 嵌套 ===== */
  if (window !== window.top) { window.top.location.replace(window.location); }

  /* ===== Three.js 螺旋粒子动画 ===== */
  (function() {
    var mountElement = document.getElementById('threeContainer');
    if (!mountElement) return;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.Fog(0x050510, 10, 50);

    var camera = new THREE.PerspectiveCamera(
      60,
      mountElement.clientWidth / mountElement.clientHeight,
      0.1, 100
    );
    camera.position.set(0, 0, 12);
    camera.lookAt(0, 0, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(mountElement.clientWidth, mountElement.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    mountElement.appendChild(renderer.domElement);

    var clock = new THREE.Clock();
    var particleData = [];
    var glowSpheres = [];
    var glowData = [];

    // 背景粒子
    var bgGeo = new THREE.BoxGeometry(0.6, 0.8, 0.05);
    var bgMat = new THREE.MeshPhysicalMaterial({
      color: 0x000000,
      metalness: 0.1,
      roughness: 0.1,
      transmission: 0.6,
      thickness: 0.5,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide,
    });
    var bgMesh = new THREE.InstancedMesh(bgGeo, bgMat, 150);
    var dummy = new THREE.Object3D();

    for (var i = 0; i < 150; i++) {
      var data = {
        angle: Math.random() * Math.PI * 2,
        radius: 4 + Math.random() * 8,
        speed: 0.05 + Math.random() * 0.1,
        yOffset: (Math.random() - 0.5) * 12,
        rotationSpeed: {
          x: (Math.random() - 0.5) * 0.02,
          y: (Math.random() - 0.5) * 0.02,
        },
        type: Math.random() > 0.5 ? 0 : 1,
        phase: Math.random() * Math.PI * 2,
      };
      particleData.push(data);

      var x = Math.cos(data.angle) * data.radius;
      var y = (Math.random() - 0.5) * 10;
      var z = Math.sin(data.angle) * data.radius;
      dummy.position.set(x, y, z);
      dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      dummy.updateMatrix();
      bgMesh.setMatrixAt(i, dummy.matrix);
    }
    bgMesh.instanceMatrix.needsUpdate = true;
    scene.add(bgMesh);

    // 螺旋链
    var helixGeo = new THREE.PlaneGeometry(0.5, 0.5);
    var helixMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.9,
      roughness: 0.1,
      transparent: true,
      opacity: 0.9,
    });

    var strand1 = new THREE.InstancedMesh(helixGeo, helixMat, 100);
    var strand2 = new THREE.InstancedMesh(helixGeo, helixMat, 100);
    scene.add(strand1);
    scene.add(strand2);

    var strand1Data = [];
    var strand2Data = [];

    for (var strandIndex = 0; strandIndex < 2; strandIndex++) {
      var strand = strandIndex === 0 ? strand1 : strand2;
      var dataArray = strandIndex === 0 ? strand1Data : strand2Data;
      var strandOffset = strandIndex === 0 ? 0 : Math.PI;

      for (var i = 0; i < 100; i++) {
        var data = {
          index: i,
          strand: strandIndex,
          angle: (i / 20) * Math.PI * 2,
          radius: 2.5,
          speed: 0.2,
          yPos: (i / 100) * 10 - 5,
          offset: strandOffset,
          scalePhase: i * 0.1,
          baseScale: 0.5 + Math.random() * 0.5,
          highlightIntensity: 0,
        };
        dataArray.push(data);
        particleData.push(data);

        var x = Math.cos(data.angle + data.offset) * data.radius;
        var y = data.yPos;
        var z = Math.sin(data.angle + data.offset) * data.radius;
        var scale = data.baseScale;
        dummy.position.set(x, y, z);
        dummy.scale.set(scale, scale, scale);
        dummy.rotation.set(0, 0, -data.angle);
        dummy.updateMatrix();
        strand.setMatrixAt(i, dummy.matrix);
      }
      strand.instanceMatrix.needsUpdate = true;
    }

    // 发光球体
    var sphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
    var glowMat = new THREE.MeshBasicMaterial({
      color: 0x4d9fff,
      transparent: true,
      opacity: 0.8,
    });

    for (var i = 0; i < 100; i++) {
      var data = {
        index: i,
        strand: i % 2,
        angle: (i / 20) * Math.PI * 2,
        radius: 2.5,
        speed: 0.2,
        yPos: (i / 100) * 10 - 5,
        offset: i % 2 === 0 ? 0 : Math.PI,
        scalePhase: i * 0.1,
        baseScale: 1,
        highlightIntensity: 0,
      };
      glowData.push(data);
      particleData.push({ type: 'glow' });

      var x = Math.cos(data.angle + data.offset) * data.radius;
      var y = data.yPos;
      var z = Math.sin(data.angle + data.offset) * data.radius;

      var glowSphere = new THREE.Mesh(sphereGeo, glowMat);
      glowSphere.position.set(x, y, z);
      glowSphere.userData = data;
      scene.add(glowSphere);
      glowSpheres.push(glowSphere);
    }

    var animFrameId;

    function animate() {
      animFrameId = requestAnimationFrame(animate);
      var delta = clock.getDelta();
      var time = clock.getElapsedTime();

      // 动画 - 螺旋链
      for (var strandIndex = 0; strandIndex < 2; strandIndex++) {
        var strand = strandIndex === 0 ? strand1 : strand2;
        var dataArray = strandIndex === 0 ? strand1Data : strand2Data;

        for (var i = 0; i < 100; i++) {
          var data = dataArray[i];
          data.angle += data.speed * delta;
          var x = Math.cos(data.angle + data.offset) * data.radius;
          var y = data.yPos;
          var z = Math.sin(data.angle + data.offset) * data.radius;

          strand.getMatrixAt(i, dummy.matrix);
          dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
          dummy.position.set(x, y, z);
          dummy.rotation.set(0, 0, -data.angle);
          var highlight = Math.sin(time * 2 + data.scalePhase) * 0.5 + 0.5;
          var scale = data.baseScale * (1 + highlight * 0.3);
          dummy.scale.set(scale, scale, scale);
          dummy.updateMatrix();
          strand.setMatrixAt(i, dummy.matrix);
        }
        strand.instanceMatrix.needsUpdate = true;
      }

      // 动画 - 发光球体
      for (var i = 0; i < glowSpheres.length; i++) {
        var sphere = glowSpheres[i];
        var data = glowData[i];
        data.angle += data.speed * delta;
        var x = Math.cos(data.angle + data.offset) * data.radius;
        var y = data.yPos + Math.sin(time + data.index) * 0.1;
        var z = Math.sin(data.angle + data.offset) * data.radius;
        sphere.position.set(x, y, z);
      }

      // 场景缓慢旋转
      scene.rotation.y = Math.sin(time * 0.1) * 0.1;

      renderer.render(scene, camera);
    }

    animate();

    var handleResize = function() {
      if (!mountElement) return;
      var w = mountElement.clientWidth;
      var h = mountElement.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };

    window.addEventListener('resize', handleResize);
  })();
</script>
</body>
</html>
