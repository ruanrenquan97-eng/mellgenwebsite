# ==============================================================================
# 美尔健官网 (Mellgen) Nginx 生产环境配置
# 功能：
# 1. 前台静态页面由 Nginx 原生高速分发
# 2. /login、/logout、/dashboard、/admin 及 /api/ 反向代理至本地 Python CMS (http://127.0.0.1:8001)
# ==============================================================================

server {
    listen 80;
    server_name www.mellgen.com mellgen.com;

    # 若已配置 HTTPS，建议取消以下重定向注释：
    # return 301 https://$host$request_uri;

    # 网站根目录（对应服务器上项目代码路径）
    root /var/www/mellgenwebsite;
    index index.html mellgen_home.html;

    # --------------------------------------------------------------------------
    # CMS 后台系统反向代理 (指向 Python Flask: http://127.0.0.1:8001)
    # --------------------------------------------------------------------------

    # 1. 登录与登出
    location /login {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. 后台管理面板
    location ~ ^/(dashboard|admin) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. CMS 所有后台接口（涵盖内容管理、在线留言、文件上传、WorkBuddy连接器等）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 允许上传最大 50MB 媒体与附件
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 前台静态文件托管
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存优化
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
